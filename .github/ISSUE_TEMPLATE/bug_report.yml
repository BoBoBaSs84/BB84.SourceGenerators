name: Bug report
description: Create a report to help us improve
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: To reproduce
      description: Steps to reproduce the behavior. A minimal code sample with the relevant attribute is ideal.
      placeholder: |
        1. Annotate a class with '...'
        2. Build the project
        3. See error / missing member
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: generated-output
    attributes:
      label: Generated output / diagnostics
      description: Paste the generated source or the compiler diagnostic (BB84SGxxxx) if applicable.
      render: text
    validations:
      required: false
  - type: input
    id: package-version
    attributes:
      label: BB84.SourceGenerators version
      placeholder: e.g. 2026.8.30.1
    validations:
      required: true
  - type: input
    id: sdk-version
    attributes:
      label: .NET SDK version
      description: Output of `dotnet --version`.
      placeholder: e.g. 10.0.100
    validations:
      required: true
  - type: input
    id: target-framework
    attributes:
      label: Target framework(s)
      placeholder: e.g. net8.0
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
    validations:
      required: false
